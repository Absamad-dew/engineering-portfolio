<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc"><title id="title">CoreBroker: observed parallel and resource-locked execution</title><desc id="desc">Two independent workers overlap on separate physical cores. With one shared lock the second worker waits and their execution intervals do not overlap. All intervals come from an actual local run.</desc><rect width="1280" height="710" rx="18" fill="#f7f8fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="55" font-size="27" font-weight="700" fill="#20243d">Parallel work, controlled resources.</text><text x="48" y="87" font-size="16" fill="#566078">Actual CoreBroker execution · 3 Nov 2026 · one physical core per worker</text><rect x="32" y="122" width="1216" height="221" rx="15" fill="white" stroke="#dce0ee"/><text x="55" y="157" font-size="21" font-weight="600" fill="#20243d">Independent jobs: overlap on separate cores</text><line x1="170.0" y1="182" x2="170.0" y2="292" stroke="#e5e8f1"/><text x="170.0" y="315" font-size="13" text-anchor="middle" fill="#667085">0s</text><line x1="366.2" y1="182" x2="366.2" y2="292" stroke="#e5e8f1"/><text x="366.2" y="315" font-size="13" text-anchor="middle" fill="#667085">2s</text><line x1="562.4" y1="182" x2="562.4" y2="292" stroke="#e5e8f1"/><text x="562.4" y="315" font-size="13" text-anchor="middle" fill="#667085">4s</text><line x1="758.6" y1="182" x2="758.6" y2="292" stroke="#e5e8f1"/><text x="758.6" y="315" font-size="13" text-anchor="middle" fill="#667085">6s</text><line x1="954.8" y1="182" x2="954.8" y2="292" stroke="#e5e8f1"/><text x="954.8" y="315" font-size="13" text-anchor="middle" fill="#667085">8s</text><line x1="1151.0" y1="182" x2="1151.0" y2="292" stroke="#e5e8f1"/><text x="1151.0" y="315" font-size="13" text-anchor="middle" fill="#667085">10s</text><text x="55" y="213" font-size="17" fill="#20243d">Job A</text><text x="55" y="232" font-size="12" fill="#667085">physical ID 0</text><line x1="170.0" y1="209" x2="252.3" y2="209" stroke="#a7afc2" stroke-width="3" stroke-dasharray="4 4"/><circle cx="170.0" cy="209" r="4" fill="#68748e"/><rect x="252.3" y="193" width="392.5" height="34" rx="7" fill="#6554b8"/><text x="448.5" y="215" text-anchor="middle" fill="white" font-size="14">0.84–4.84s</text><text x="55" y="270" font-size="17" fill="#20243d">Job B</text><text x="55" y="289" font-size="12" fill="#667085">physical ID 2</text><line x1="254.9" y1="266" x2="342.0" y2="266" stroke="#a7afc2" stroke-width="3" stroke-dasharray="4 4"/><circle cx="254.9" cy="266" r="4" fill="#68748e"/><rect x="342.0" y="250" width="392.5" height="34" rx="7" fill="#087f8c"/><text x="538.2" y="272" text-anchor="middle" fill="white" font-size="14">1.75–5.75s</text><rect x="32" y="362" width="1216" height="221" rx="15" fill="white" stroke="#dce0ee"/><text x="55" y="397" font-size="21" font-weight="600" fill="#20243d">Shared resource: worker intervals do not overlap</text><line x1="170.0" y1="422" x2="170.0" y2="532" stroke="#e5e8f1"/><text x="170.0" y="555" font-size="13" text-anchor="middle" fill="#667085">0s</text><line x1="366.2" y1="422" x2="366.2" y2="532" stroke="#e5e8f1"/><text x="366.2" y="555" font-size="13" text-anchor="middle" fill="#667085">2s</text><line x1="562.4" y1="422" x2="562.4" y2="532" stroke="#e5e8f1"/><text x="562.4" y="555" font-size="13" text-anchor="middle" fill="#667085">4s</text><line x1="758.6" y1="422" x2="758.6" y2="532" stroke="#e5e8f1"/><text x="758.6" y="555" font-size="13" text-anchor="middle" fill="#667085">6s</text><line x1="954.8" y1="422" x2="954.8" y2="532" stroke="#e5e8f1"/><text x="954.8" y="555" font-size="13" text-anchor="middle" fill="#667085">8s</text><line x1="1151.0" y1="422" x2="1151.0" y2="532" stroke="#e5e8f1"/><text x="1151.0" y="555" font-size="13" text-anchor="middle" fill="#667085">10s</text><text x="55" y="453" font-size="17" fill="#20243d">Job A</text><text x="55" y="472" font-size="12" fill="#667085">physical ID 0</text><line x1="170.0" y1="449" x2="258.0" y2="449" stroke="#a7afc2" stroke-width="3" stroke-dasharray="4 4"/><circle cx="170.0" cy="449" r="4" fill="#68748e"/><rect x="258.0" y="433" width="392.4" height="34" rx="7" fill="#6554b8"/><text x="454.2" y="455" text-anchor="middle" fill="white" font-size="14">0.90–4.90s</text><text x="55" y="510" font-size="17" fill="#20243d">Job B</text><text x="55" y="529" font-size="12" fill="#667085">physical ID 0</text><line x1="260.1" y1="506" x2="748.8" y2="506" stroke="#a7afc2" stroke-width="3" stroke-dasharray="4 4"/><circle cx="260.1" cy="506" r="4" fill="#68748e"/><rect x="748.8" y="490" width="392.5" height="34" rx="7" fill="#087f8c"/><text x="945.1" y="512" text-anchor="middle" fill="white" font-size="14">5.90–9.90s</text><text x="48" y="631" font-size="15" fill="#38445c">Solid bars: observed worker intervals. Dotted lines: submission to worker start, including startup/handoff.</text><text x="48" y="659" font-size="15" fill="#38445c">Synthetic four-second resource holds expose scheduling behavior; this is not a throughput benchmark.</text><text x="48" y="687" font-size="14" fill="#667085">Nonexclusive · no global power changes · all four jobs exited 0 · raw observations linked in the case study</text></g></svg>